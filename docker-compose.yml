services:
  mongodb:
    image: mongo:7.0
    container_name: bash_mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: bash
    volumes:
      - bash_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional local Redis service (for Phase 4 distributed CAS rate-limiting tests)
  # redis:
  #   image: redis:7-alpine
  #   container_name: bash_redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - bash_redis_data:/data

volumes:
  bash_mongo_data:
    driver: local
  # bash_redis_data:
  #   driver: local
